<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat Sederhana</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  
  body {
    background: linear-gradient(135deg, #1e1e2f, #2d2d44);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .chat-container {
    width: 400px;
    height: 600px;
    background: #fff;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
  }

  .chat-header {
    background: linear-gradient(90deg, #6a5acd, #8a2be2);
    color: white;
    padding: 15px;
    text-align: center;
    font-weight: bold;
    font-size: 18px;
  }

  .chat-box {
    flex: 1;
    padding: 15px;
    overflow-y: auto;
    background: #f4f4f8;
  }

  .message {
    max-width: 75%;
    padding: 10px 14px;
    margin: 8px 0;
    border-radius: 15px;
    font-size: 14px;
    line-height: 1.4;
    animation: fadeIn 0.3s ease;
  }

  .user {
    background: #6a5acd;
    color: white;
    margin-left: auto;
    border-bottom-right-radius: 3px;
  }

  .bot {
    background: #e0e0e0;
    color: #222;
    margin-right: auto;
    border-bottom-left-radius: 3px;
  }

  .chat-input {
    display: flex;
    padding: 10px;
    background: #fff;
    border-top: 1px solid #ddd;
  }

  .chat-input input {
    flex: 1;
    padding: 10px 15px;
    border: 1px solid #ccc;
    border-radius: 25px;
    outline: none;
    font-size: 14px;
  }

  .chat-input button {
    margin-left: 8px;
    padding: 10px 18px;
    background: #6a5acd;
    color: white;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    transition: 0.2s;
  }

  .chat-input button:hover { background: #5540b5; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">🤖 AI Assistant</div>
  <div class="chat-box" id="chatBox">
    <div class="message bot">Halo! Saya AI sederhana. Ada yang bisa saya bantu?</div>
  </div>
  <div class="chat-input">
    <input type="text" id="userInput" placeholder="Tulis pesan..." onkeypress="handleKey(event)">
    <button onclick="sendMessage()">Kirim</button>
  </div>
</div>

<script>
  const chatBox = document.getElementById('chatBox');
  const userInput = document.getElementById('userInput');

  // Simulasi balasan AI (bisa diganti dengan API seperti OpenAI)
  const responses = [
    "Menarik! Bisa ceritakan lebih lanjut?",
    "Saya mengerti maksud Anda.",
    "Terima kasih sudah bertanya.",
    "Bisa dijelaskan dengan detail?",
    "Itu pertanyaan bagus!",
    "Saya masih belajar, tapi saya coba bantu ya.",
    "Hmm, coba tanyakan hal lain.",
  ];

  function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;

    addMessage(text, 'user');
    userInput.value = '';

    // Balasan bot setelah delay
    setTimeout(() => {
      const reply = responses[Math.floor(Math.random() * responses.length)];
      addMessage(reply, 'bot');
    }, 700);
  }

  function addMessage(text, sender) {
    const div = document.createElement('div');
    div.className = 'message ' + sender;
    div.textContent = text;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function handleKey(e) {
    if (e.key === 'Enter') sendMessage();
  }
</script>

</body>
</html>
